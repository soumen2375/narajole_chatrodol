<div class="bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">ব্যবহারকারী ম্যানেজমেন্ট</h2>

  <!-- Add New User Form -->
  <div class="mb-8 p-4 bg-gray-50 rounded-md">
    <h3 class="text-xl font-semibold mb-4 text-gray-800">নতুন ব্যবহারকারী যোগ করুন</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label for="userName" class="block text-sm font-medium text-gray-700">নাম</label>
        <input id="userName" type="text" [(ngModel)]="newUser.name" placeholder="ব্যবহারকারীর নাম"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm p-2">
      </div>
      <div>
        <label for="userEmail" class="block text-sm font-medium text-gray-700">ইমেল</label>
        <input id="userEmail" type="email" [(ngModel)]="newUser.email" placeholder="user@example.com"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm p-2">
      </div>
      <div>
        <label for="userRole" class="block text-sm font-medium text-gray-700">ভূমিকা</label>
        <select id="userRole" [(ngModel)]="newUser.role"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm p-2">
          @for (role of roles; track role) {
            <option [value]="role">{{ role | titlecase }}</option>
          }
        </select>
      </div>
    </div>
    <div class="flex justify-end mt-4">
      <button (click)="addUser()"
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-150 ease-in-out">
        ব্যবহারকারী যোগ করুন
      </button>
    </div>
  </div>

  <!-- User List -->
  @if (users().length > 0) {
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              নাম
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              ইমেল
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              ভূমিকা
            </th>
            <th scope="col" class="relative px-6 py-3">
              <span class="sr-only">কর্ম</span>
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          @for (user of users(); track user.id) {
            <tr>
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm font-medium text-gray-900">{{ user.name }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm text-gray-500">{{ user.email }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <select [ngModel]="user.role" (change)="updateUserRole(user.id, $event)"
                        class="block w-full rounded-md border-gray-300 shadow-sm sm:text-sm p-1">
                  @for (role of roles; track role) {
                    <option [value]="role">{{ role | titlecase }}</option>
                  }
                </select>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <button (click)="deleteUser(user.id)" class="text-red-600 hover:text-red-900">মুছে ফেলুন</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <p class="text-center text-gray-500 py-8">কোন ব্যবহারকারী পাওয়া যায়নি।</p>
  }
</div>
