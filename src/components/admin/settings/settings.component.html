<div class="bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">সাইট সেটিংস</h2>

  <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Site Name -->
    <div>
      <label for="siteName" class="block text-sm font-medium text-gray-700">সাইটের নাম</label>
      <input id="siteName" type="text" formControlName="siteName"
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2">
    </div>

    <!-- Primary Color -->
    <div>
      <label for="primaryColor" class="block text-sm font-medium text-gray-700">প্রাথমিক রং</label>
      <input id="primaryColor" type="color" formControlName="primaryColor"
             class="mt-1 block w-24 h-10 rounded-md border-gray-300 shadow-sm">
    </div>

    <!-- Secondary Color -->
    <div>
      <label for="secondaryColor" class="block text-sm font-medium text-gray-700">সহকারী রং</label>
      <input id="secondaryColor" type="color" formControlName="secondaryColor"
             class="mt-1 block w-24 h-10 rounded-md border-gray-300 shadow-sm">
    </div>

    <!-- Accent Color -->
    <div>
      <label for="accentColor" class="block text-sm font-medium text-gray-700">অ্যাকসেন্ট রং</label>
      <input id="accentColor" type="color" formControlName="accentColor"
             class="mt-1 block w-24 h-10 rounded-md border-gray-300 shadow-sm">
    </div>

    <!-- Header Font -->
    <div>
      <label for="headerFont" class="block text-sm font-medium text-gray-700">হেডার ফন্ট</label>
      <select id="headerFont" formControlName="headerFont"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2">
        @for (font of fonts(); track font) {
          <option [value]="font">{{ font }}</option>
        }
      </select>
    </div>

    <!-- Body Font -->
    <div>
      <label for="bodyFont" class="block text-sm font-medium text-gray-700">বডি ফন্ট</label>
      <select id="bodyFont" formControlName="bodyFont"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2">
        @for (font of fonts(); track font) {
          <option [value]="font">{{ font }}</option>
        }
      </select>
    </div>

    <div class="flex justify-end mt-6">
      <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-150 ease-in-out">
        সেটিংস সংরক্ষণ করুন
      </button>
    </div>
  </form>
</div>
