<header class="bg-blue-700 text-white shadow-md">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <!-- Logo and Site Title -->
    <div class="flex items-center">
      <a routerLink="/" class="flex items-center text-white hover:text-gray-100 transition duration-200">
        <!-- Placeholder Logo Area -->
        <div class="bg-white w-8 h-8 rounded-full flex items-center justify-center mr-3">
          <img src="src\assets\images\favicon\favicon512.png" class="w-5 h-5" alt="icon" />
 </div>
        <span class="text-2xl md:text-3xl font-bold" [style.fontFamily]="headerFont()">নাড়াজোল ছাত্রদল</span>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <nav class="hidden lg:flex space-x-6 text-lg font-medium">
      <a routerLink="/" routerLinkActive="border-b-2 border-white" [routerLinkActiveOptions]="{exact: true}" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">হোম</a>
      <a routerLink="/about" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">আমাদের কথা</a>
      <a routerLink="/programs" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">কর্মসূচি</a>
      <a routerLink="/events" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">অনুষ্ঠান</a>
      <a routerLink="/gallery" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">চিত্রশালা</a>
      <a routerLink="/impacts" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">প্রভাব</a>
      <a routerLink="/contact" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">যোগাযোগ</a>
      <a routerLink="/volunteer" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">স্বেচ্ছাসেবক হোন</a>
      <a routerLink="/donate" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">অনুদান</a>
      <a routerLink="/admin" routerLinkActive="border-b-2 border-white" class="pb-1 hover:text-gray-200 transition duration-150 ease-in-out">অ্যাডমিন</a>
    </nav>

    <!-- Mobile Hamburger Menu -->
    <div class="lg:hidden">
      <button (click)="onMenuToggle()" class="text-white focus:outline-none">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
