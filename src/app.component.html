<div class="flex flex-col min-h-screen">
  <app-header (menuToggle)="toggleMenu()" [isMenuOpen]="isMenuOpen()"></app-header>

  <!-- Mobile Menu Overlay -->
  @if (isMenuOpen()) {
    <div (click)="closeMenu()" class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>
    <div class="fixed top-0 right-0 h-full w-64 bg-white shadow-lg p-5 z-50 transform transition-transform duration-300 ease-in-out"
         [class.-translate-x-0]="isMenuOpen()"
         [class.translate-x-full]="!isMenuOpen()">
      <div class="flex justify-end mb-4">
        <button (click)="closeMenu()" class="text-gray-600 hover:text-gray-900 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <nav class="flex flex-col space-y-4 text-lg">
        <a routerLink="/" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-blue-500 transition duration-150 ease-in-out">হোম</a>
        <a routerLink="/about" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">আমাদের কথা</a>
        <a routerLink="/programs" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">কর্মসূচি</a>
        <a routerLink="/events" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">অনুষ্ঠান</a>
        <a routerLink="/gallery" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">চিত্রশালা</a>
        <a routerLink="/impacts" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">প্রভাব</a>
        <a routerLink="/contact" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">যোগাযোগ</a>
        <a routerLink="/volunteer" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">স্বেচ্ছাসেবক হোন</a>
        <a routerLink="/donate" (click)="closeMenu()" routerLinkActive="text-blue-600 font-semibold" class="hover:text-blue-500 transition duration-150 ease-in-out">অনুদান</a>
         </nav>
    </div>
  }

  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
