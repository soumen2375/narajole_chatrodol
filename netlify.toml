[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. Note: no `force` flag, so real static files (JS/CSS/images)
# are served first and only unknown routes fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
