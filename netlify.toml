[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. Note: no `force` flag, so real static files (JS/CSS/images)
# are served first and only unknown routes fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimize browser caching for Vite bundled production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
